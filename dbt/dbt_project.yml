name: rdw
version: "1.0.0"
profile: rdw

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  rdw:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  rdw:
    +schema: marts
    defect_family:
      +column_types:
        defect_code: varchar(10)
        family: varchar(20)
        description_fr: varchar(100)
